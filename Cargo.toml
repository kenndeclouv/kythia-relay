[package]
name = "kythia-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

tokio-tungstenite = "0.20"
futures-util = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dashmap = "5.5"

# Logging and tracing
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

dotenvy = "0.15"

# Time handling
chrono = "0.4"

# Authentication
jsonwebtoken = "9"

# Rate limiting
governor = "0.6"
