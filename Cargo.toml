[package]
name = "kythia-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kythia-relay"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

# tokio-tungstenite = "0.20"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# openssl = { version = "0.10", features = ["vendored"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dashmap = "5.5"

# Logging
log = "0.4"
env_logger = "0.10"

dotenvy = "0.15"

# Time handling
chrono = "0.4"

# Authentication
jsonwebtoken = "9"

# Rate limiting
governor = "0.6"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls", 
    "mysql",
    "chrono",
] }

# Cryptography
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
